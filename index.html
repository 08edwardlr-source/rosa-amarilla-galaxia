<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070416">
  <meta name="description" content="Una rosa amarilla realista flotando en una galaxia viva.">
  <title>Una rosa entre galaxias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="universe" aria-hidden="true"></canvas>
  <div class="aurora aurora-a"></div><div class="aurora aurora-b"></div>
  <div class="grain"></div><div class="vignette"></div>

  <main class="scene" id="scene">
    <section class="message" aria-label="Dedicatoria">
      <span class="eyebrow">UN DETALLE PARA TI ANAKARÉ</span>
      <h1>Una rosa,<br><em>todo un universo</em></h1>
      <div class="gold-line"><i></i><span>✦</span><i></i></div>
      <p>Se que no es mucho pero es con todo mi amor ♡ .</p>
      <button id="wishButton" class="wish-button"><span>✦</span> Pide un deseo</button>
    </section>

    <section class="rose-stage" id="roseStage" aria-label="Rosa amarilla realista">
      <div class="orbit orbit-one"><b></b><b></b><b></b></div>
      <div class="orbit orbit-two"><b></b><b></b></div>
      <div class="rose-aura"></div>
      <div class="rose-wrap" id="roseWrap">
        <img class="rose" src="rosa-amarilla-realista.png" alt="Rosa amarilla realista con gotas de rocío">
        <div class="rose-shine"></div>
      </div>
      <div class="ground-glow"></div>
    </section>
  </main>

  <div class="quote" id="quote">“Incluso entre millones de estrellas, hay luces que son únicas.”</div>
  <div class="controls">
    <button id="soundButton" title="Activar ambiente" aria-label="Activar ambiente">♪</button>
    <button id="sparkButton" title="Más destellos" aria-label="Más destellos">✦</button>
    <button id="fullButton" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
  </div>
  <div class="loading" id="loading"><div class="loader-flower">✦</div><span>CREANDO TU UNIVERSO</span></div>
  <script src="script.js"></script>
</body>
</html>
